<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    MASKABLE variant for Android adaptive icons.

    Android crops the icon to whatever shape the launcher uses (circle,
    squircle, rounded square), keeping only the middle ~80%. The standard icon
    puts the bag close to the edges, so on a circular launcher its corners get
    sliced off. Here the artwork is scaled to 62% and centred, leaving the
    safe zone clear whatever shape is applied, and the background bleeds to
    every edge so no transparent corner shows through.
  -->
  <rect width="512" height="512" fill="#4F46E5"/>
  <g transform="translate(97.5 97.5) scale(0.62)">
    <rect x="128" y="210" width="256" height="210" rx="20" fill="white"/>
    <path d="M198 210 L198 178 Q198 128 256 128 Q314 128 314 178 L314 210"
          fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="188" y="280" width="136" height="14" rx="7" fill="#4F46E5" opacity="0.4"/>
    <rect x="188" y="314" width="96" height="14" rx="7" fill="#4F46E5" opacity="0.4"/>
    <circle cx="222" cy="414" r="14" fill="#4F46E5" opacity="0.3"/>
    <circle cx="290" cy="414" r="14" fill="#4F46E5" opacity="0.3"/>
  </g>
</svg>
