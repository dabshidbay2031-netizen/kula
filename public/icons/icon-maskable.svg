<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    MASKABLE variant for Android adaptive icons.

    Android crops the icon to whatever shape the launcher uses (circle,
    squircle, rounded square), keeping only the middle ~80%. The standard icon
    puts the lock close to the edges, so on a circular launcher its corners get
    sliced off. Here the artwork is scaled to 62% and centred, leaving the
    safe zone clear whatever shape is applied, and the background bleeds to
    every edge so no transparent corner shows through.

    Ids are suffixed -m so this file can be inlined alongside icon.svg on the
    same page without the two masks colliding.
  -->
  <defs>
    <linearGradient id="hm-bg-m" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#1B6DF0"/>
      <stop offset="1" stop-color="#0A38BE"/>
    </linearGradient>
    <mask id="hm-bars-m">
      <rect x="88" y="196" width="336" height="284" rx="34" fill="#fff"/>
      <rect x="152" y="276" width="208" height="28" rx="14" fill="#000"/>
      <rect x="152" y="334" width="208" height="28" rx="14" fill="#000"/>
      <rect x="152" y="392" width="134" height="28" rx="14" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#hm-bg-m)"/>
  <g transform="translate(97.5 97.5) scale(0.62)">
    <path d="M198 210V126a58 58 0 0 1 116 0v84"
          fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round"/>
    <rect x="88" y="196" width="336" height="284" rx="34" fill="#fff" mask="url(#hm-bars-m)"/>
  </g>
</svg>
