<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Hamar Mall app icon — the padlock brand mark.

    The three bars are CUT OUT of the lock face with a mask rather than painted
    over it, so they show the gradient behind and stay in register at every
    size. Painting them as flat shapes meant picking one blue that only matched
    the background at a single point of the gradient.

    PNG/ICO variants are generated from this file: node scripts/gen-icons.mjs
  -->
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#1B6DF0"/>
      <stop offset="1" stop-color="#0A38BE"/>
    </linearGradient>
    <mask id="hm-bars">
      <rect x="88" y="196" width="336" height="284" rx="34" fill="#fff"/>
      <rect x="152" y="276" width="208" height="28" rx="14" fill="#000"/>
      <rect x="152" y="334" width="208" height="28" rx="14" fill="#000"/>
      <rect x="152" y="392" width="134" height="28" rx="14" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#hm-bg)"/>

  <!-- Shackle first; the body then covers where its legs end. -->
  <path d="M198 210V126a58 58 0 0 1 116 0v84"
        fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round"/>
  <rect x="88" y="196" width="336" height="284" rx="34" fill="#fff" mask="url(#hm-bars)"/>
</svg>
